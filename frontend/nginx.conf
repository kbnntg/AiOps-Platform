server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SSE 流式接口（Copilot）
    location /api/copilot/ {
        proxy_pass http://aiops-backend:8000/api/copilot/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";         # 禁用 keep-alive 复用
        proxy_buffering off;                     # 禁用缓冲
        proxy_cache off;                         # 禁用缓存
        proxy_read_timeout 300s;                 # 长连接超时
        chunked_transfer_encoding on;
    }

    # WebSocket 日志流
    location /api/ws/ {
        proxy_pass http://aiops-backend:8000/api/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # 普通 API
    location /api/ {
        proxy_pass http://aiops-backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }

    # 前端 SPA
    location / {
        try_files $uri $uri/ /index.html;
    }
}
