apiVersion: apps/v1
kind: Deployment
metadata:
  name: aiops-frontend
  namespace: privatization
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aiops-frontend
  template:
    metadata:
      labels:
        app: aiops-frontend
    spec:
      containers:
      - name: frontend
        image: aiops-frontend:v1
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: aiops-frontend
  namespace: privatization
spec:
  selector:
    app: aiops-frontend
  ports:
  - port: 80
    targetPort: 80
  type: NodePort
