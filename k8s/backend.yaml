apiVersion: apps/v1
kind: Deployment
metadata:
  name: aiops-backend
  namespace: privatization
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aiops-backend
  template:
    metadata:
      labels:
        app: aiops-backend
    spec:
      serviceAccountName: aiops-backend
      terminationGracePeriodSeconds: 60
      containers:
      - name: backend
        image: aiops-backend:v1
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        volumeMounts:
        - name: chroma-data
          mountPath: /app/data/chroma

        env:
        - name: MYSQL_HOST
          value: "mysql-service"
        - name: MYSQL_USER
          value: "root"
        - name: MYSQL_DB
          value: "aiops_platform"
        - name: MYSQL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: aiops-secret
              key: mysql-password
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: aiops-secret
              key: jwt-secret
        - name: PROMETHEUS_URL
          value: "http://prometheus:9090"
        - name: API_KEY
          valueFrom:
            secretKeyRef:
              name: aiops-secret
              key: api-key
        - name: API_URL
          value: "https://api.deepseek.com/v1"
        - name: LOG_MODEL_NAME
          value: "deepseek-chat"
        - name: EMBEDDING_API_KEY
          valueFrom:
            secretKeyRef:
              name: aiops-secret
              key: embedding-api-key
        - name: EMBEDDING_API_URL
          value: "https://api.siliconflow.cn/v1"
        - name: EMBEDDING_MODEL
          value: "BAAI/bge-large-zh-v1.5"
        - name: CHROMA_PERSIST_DIR
          value: "/app/data/chroma"
        - name: ANONYMIZED_TELEMETRY
          value: "False"
        - name: REDIS_HOST
          value: "redis-service"
        - name: REDIS_PORT
          value: "6379"

        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"

        readinessProbe:
          httpGet:
            path: /api/health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3

      volumes:
      - name: chroma-data
        persistentVolumeClaim:
          claimName: chroma-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: aiops-backend
  namespace: privatization
spec:
  selector:
    app: aiops-backend
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800
  ports:
  - port: 8000
    targetPort: 8000
  type: NodePort
