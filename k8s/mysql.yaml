# mysql.yaml
apiVersion: v1
kind: Service
metadata:
  name: mysql-service
  namespace: privatization
spec:
  selector:
    app: aiops-mysql
  ports:
  - port: 3306
    targetPort: 3306
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aiops-mysql
  namespace: privatization
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aiops-mysql
  template:
    metadata:
      labels:
        app: aiops-mysql
    spec:
      containers:
      - name: mysql
        image: mysql:8.0
        env:
        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: aiops-secret
              key: mysql-password
        - name: MYSQL_DATABASE
          value: aiops_platform
        ports:
        - containerPort: 3306
        volumeMounts:
        - name: mysql-data
          mountPath: /var/lib/mysql
        - name: init-sql
          mountPath: /docker-entrypoint-initdb.d
      volumes:
      - name: mysql-data
        emptyDir: {}       # 测试用，重启数据会丢；生产要用 PVC
      - name: init-sql
        configMap:
          name: mysql-init
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-init
  namespace: privatization
data:
  init.sql: |
    USE aiops_platform;

    CREATE TABLE IF NOT EXISTS users (
        id INT AUTO_INCREMENT PRIMARY KEY,
        username VARCHAR(50) UNIQUE NOT NULL,
        password_hash VARCHAR(255) NOT NULL,
        role VARCHAR(20) NOT NULL DEFAULT 'viewer',
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
    );

    CREATE TABLE IF NOT EXISTS metrics (
        id INT AUTO_INCREMENT PRIMARY KEY,
        timestamp DATETIME NOT NULL,
        cpu_usage FLOAT,
        memory_usage FLOAT,
        disk_usage FLOAT,
        disk_read_mb FLOAT,
        disk_write_mb FLOAT,
        disk_read_count INT,
        disk_write_count INT,
        net_send_mb FLOAT,
        net_resv_mb FLOAT
    );

    CREATE TABLE IF NOT EXISTS alert_history (
        id INT AUTO_INCREMENT PRIMARY KEY,
        resource VARCHAR(50) NOT NULL,
        value FLOAT NOT NULL,
        threshold FLOAT NOT NULL,
        node VARCHAR(200) NOT NULL,
        ai_advice TEXT,
        status VARCHAR(20) DEFAULT 'OPEN',
        triggered_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        resolved_at TIMESTAMP NULL,
        resolved_by VARCHAR(50)
    );

    CREATE TABLE IF NOT EXISTS operation_audit (
        id INT AUTO_INCREMENT PRIMARY KEY,
        username VARCHAR(50) NOT NULL,
        action VARCHAR(100) NOT NULL,
        resource_type VARCHAR(50),
        resource_name VARCHAR(200),
        namespace VARCHAR(100),
        details TEXT,
        result VARCHAR(20) DEFAULT 'SUCCESS',
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
    );

    -- 初始管理员：admin / admin123
    INSERT INTO users (username, password_hash, role) VALUES
    ('admin', '$2b$12$LQv3c1yqBWVHxkd0LHAkCOYz6TtxMQJqhN8/X4.PzWpzJZC3Vv1vK', 'admin')
    ON DUPLICATE KEY UPDATE username = username;
