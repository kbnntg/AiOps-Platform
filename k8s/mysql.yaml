# Headless Service（StatefulSet用来建立）
apiVersion: v1
kind: Service
metadata:
  name: mysql-headless
  namespace: privatization
spec:
  clusterIP: None
  selector:
    app: aiops-mysql
  ports:
  - port: 3306
    targetPort: 3306
---
# 普通 Service：给普通应用用的
apiVersion: v1
kind: Service
metadata:
  name: mysql-service
  namespace: privatization
spec:
  selector:
    app: aiops-mysql
  ports:
  - port: 3306
    targetPort: 3306
---
# StatefulSet
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: aiops-mysql
  namespace: privatization
spec:
  serviceName: mysql-headless
  replicas: 1
  selector:
    matchLabels:
      app: aiops-mysql
  template:
    metadata:
      labels:
        app: aiops-mysql
    spec:
      containers:
      - name: mysql
        image: mysql:8.0
        env:
        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: aiops-secret
              key: mysql-password
        - name: MYSQL_DATABASE
          value: aiops_platform
        ports:
        - containerPort: 3306
        volumeMounts:
        - name: mysql-data
          mountPath: /var/lib/mysql
        - name: init-sql
          mountPath: /docker-entrypoint-initdb.d
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "1Gi"
            cpu: "500m"
      volumes:
      - name: init-sql
        configMap:
          name: mysql-init
  volumeClaimTemplates:
  - metadata:
      name: mysql-data
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 10Gi
---
# ConfigMap：初始化INit
apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-init
  namespace: privatization
data:
  init.sql: |
    USE aiops_platform;

    CREATE TABLE IF NOT EXISTS users (
        id INT AUTO_INCREMENT PRIMARY KEY,
        username VARCHAR(50) UNIQUE NOT NULL,
        password_hash VARCHAR(255) NOT NULL,
        role VARCHAR(20) NOT NULL DEFAULT 'viewer',
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
    );

    CREATE TABLE IF NOT EXISTS metrics (
        id INT AUTO_INCREMENT PRIMARY KEY,
        timestamp DATETIME NOT NULL,
        cpu_usage FLOAT,
        memory_usage FLOAT,
        disk_usage FLOAT,
        disk_read_mb FLOAT,
        disk_write_mb FLOAT,
        disk_read_count INT,
        disk_write_count INT,
        net_send_mb FLOAT,
        net_resv_mb FLOAT
    );

    CREATE TABLE IF NOT EXISTS alert_history (
        id INT AUTO_INCREMENT PRIMARY KEY,
        resource VARCHAR(50) NOT NULL,
        value FLOAT NOT NULL,
        threshold FLOAT NOT NULL,
        node VARCHAR(200) NOT NULL,
        ai_advice TEXT,
        status VARCHAR(20) DEFAULT 'OPEN',
        raw_count INT DEFAULT 1,
        is_false_positive TINYINT DEFAULT 0,
        triggered_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        resolved_at TIMESTAMP NULL,
        resolved_by VARCHAR(50)
    );

    CREATE TABLE IF NOT EXISTS operation_audit (
        id INT AUTO_INCREMENT PRIMARY KEY,
        username VARCHAR(50) NOT NULL,
        action VARCHAR(100) NOT NULL,
        resource_type VARCHAR(50),
        resource_name VARCHAR(200),
        namespace VARCHAR(100),
        details TEXT,
        result VARCHAR(20) DEFAULT 'SUCCESS',
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
    );

    INSERT INTO users (username, password_hash, role) VALUES
    ('admin', '$2b$12$nbSb1xkLDRclRTOVuMoik.e9hWmFCVdEVp3uGNv6NKy1hQYkuJjMq', 'admin')
    ON DUPLICATE KEY UPDATE username = username;
